[package]
name = "monte_python_rust"
version = "1.3.0"
edition = "2021"
description = "Rust core of monte-python (EnhancedWatershed, label growing)"
publish = false

[lib]
name = "_rust"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30", features = ["abi3-py39"] }
numpy = "0.30"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
