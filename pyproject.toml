[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "monte_python"
version = "1.3.0"
description = "Methods for Object-based and Neighborhood Threat Evaluation in Python"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Montgomery Flora" }, { name = "NOAA National Severe Storms Laboratory" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
]
# Core: object ID (EnhancedWatershed, single threshold), QC, matching, tracking.
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "scikit-image>=0.19",
    "pandas>=1.3",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
mcit = ["opencv-python-headless"]
storm-mode = ["numba", "xarray>=0.21.1"]
all = ["matplotlib>=3.5", "opencv-python-headless", "numba", "xarray>=0.21.1"]
test = ["pytest", "psutil", "netCDF4"]

[project.urls]
Source = "https://github.com/monte-flora/monte-python"

[tool.maturin]
# The Rust core (rust/) builds monte_python._rust; the pure-Python reference is the fallback without it.
manifest-path = "rust/Cargo.toml"
module-name = "monte_python._rust"
python-source = "."
python-packages = ["monte_python"]
features = ["pyo3/extension-module"]
exclude = ["monte_python/old_*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
